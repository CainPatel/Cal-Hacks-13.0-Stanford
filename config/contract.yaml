# Permissions contract. The kernel reads this at runtime; change a number here and the
# next decision changes. Owner: A. ESP32 pubkey comes from the device's serial output
# (see firmware/README.md) -- paste the hex after "PUBKEY ".
auto_release_limit_usd: 25000
escalation_confidence_threshold: 0.85
progress_tolerance_points: 10

never_allowed:
  - change_vendor_bank_details
  - release_retainage_before_final
  - pay_before_owner_draw

always_escalate:
  - first_payment_to_vendor
  - bank_detail_change
  - amount_over_limit

esp32_pubkey: "04a12febc5ae04262c841a7b35e48b42f6b7538afbd2ba6f2c15acc1e7067633cef982a236a1f95dc6a31eb36592ecb0ad2fcbc5dc37da5ac4c492b3fc9705de4b"
