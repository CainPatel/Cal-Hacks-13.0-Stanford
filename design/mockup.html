<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw dashboard mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ground: #f4f2ee; --sheet: #ffffff; --ink: #1c1a17; --quiet: #615c54; --rule: #dcd7ce; --rule-strong: #b9b2a5; --tint: #ebe7e0;
  --accent: #1f4fa3; --accent-ink: #ffffff; --accent-soft: #e7edf8;
  --pass: #2e6b3a; --pass-soft: #e2efe4; --hold: #8a5800; --hold-soft: #f5e6c3; --fail: #a3271b; --fail-soft: #f8e2de; --pending: #615c54;
  --sans: "Geist", system-ui, -apple-system, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --r: 8px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 18px/1.5 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { text-align: right; white-space: nowrap; }
.quiet { color: var(--quiet); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Mockup-only switcher, outside the product */
.mock { border-bottom: 1px dashed var(--rule-strong); font-size: 15px; }
.mock .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding-block: 6px; }
.mock button { background: none; border: 0; padding: 8px 2px; min-height: 40px; cursor: pointer; color: var(--quiet); text-decoration: underline; text-underline-offset: 3px; }
.mock button[aria-pressed="true"] { color: var(--ink); text-decoration-thickness: 2px; }

.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 32px; }
@media (max-width: 719px) { .wrap { padding-inline: 16px; } body { font-size: 17px; } }

/* Top bar */
.top { border-bottom: 1px solid var(--rule); background: var(--sheet); }
.top .wrap { display: flex; align-items: center; gap: 8px 32px; flex-wrap: wrap; min-height: 64px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding-block: 8px; }
.brand > * { white-space: nowrap; }
.brand b { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; }
.tabs a { display: flex; align-items: center; min-height: 64px; padding: 0 14px; color: var(--quiet); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 719px) { .tabs { margin-left: -14px; width: calc(100% + 28px); } .tabs a { min-height: 52px; } }

main { padding-block: 40px 80px; }
@media (max-width: 719px) { main { padding-block: 24px 64px; } }

/* Buttons and chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 22px; border-radius: var(--r); border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 18px; cursor: pointer; text-align: center; }
.btn.plain { background: transparent; color: var(--accent); }
.btn[disabled] { opacity: .6; cursor: default; }
.link { color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 44px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r); font-size: 15px; font-weight: 600; white-space: nowrap; }
.chip svg { width: 15px; height: 15px; flex: none; }
.chip.ready { color: var(--pass); background: var(--pass-soft); }
.chip.hold, .chip.ok { color: var(--hold); background: var(--hold-soft); }
.chip.fail { color: var(--fail); background: var(--fail-soft); }

/* Pay requests */
.lede { font-size: 34px; line-height: 1.25; font-weight: 600; letter-spacing: -0.02em; max-width: 26ch; }
.lede-sub { margin-top: 12px; color: var(--quiet); max-width: 60ch; }
@media (max-width: 719px) { .lede { font-size: 26px; } }
.pr { margin-top: 40px; }
@media (min-width: 1100px) { .pr { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr); gap: 40px; align-items: start; } }

.job + .job { margin-top: 48px; }
.job-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.job-head h2 { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
.job-total { padding: 10px 12px 0; display: flex; justify-content: space-between; gap: 16px; color: var(--quiet); font-size: 16px; }
.job-total .num { color: var(--ink); border-bottom: 3px double var(--ink); padding-bottom: 2px; font-size: 18px; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li + li { border-top: 1px solid var(--rule); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 24px; width: 100%; padding: 16px 12px; background: none; border: 0; text-align: left; }
button.row { cursor: pointer; }
button.row:hover { background: var(--tint); }
.row[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
.row .who { font-weight: 600; }
.row .num { font-size: 18px; }
.row .why { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 17px; }

/* Detail pane */
.detail { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 32px; }
@media (min-width: 1100px) { .detail { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; } .back { display: none !important; } }
@media (max-width: 1099px) {
  .detail { display: none; position: fixed; inset: 0; z-index: 20; border: 0; border-radius: 0; overflow: auto; padding: 16px 16px 64px; }
  .detail.open { display: block; animation: rise .2s ease-out; }
}
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.back { margin-bottom: 12px; display: inline-flex; align-items: center; gap: 6px; }
.d-head { display: flex; flex-direction: column; gap: 8px; }
.d-head h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.d-amt { font-size: 32px; font-weight: 500; letter-spacing: -0.02em; }
.d-say { margin-top: 20px; font-size: 21px; line-height: 1.4; font-weight: 500; max-width: 40ch; }
.d-next { margin-top: 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.d-next p { font-size: 16px; color: var(--quiet); max-width: 52ch; }
.section { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--rule); }
.section > h3 { font-size: 18px; font-weight: 600; margin-bottom: 14px; }

/* Signature: evidence line beside the source document */
.evidence { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 28px; }
.evidence > div { container-type: inline-size; min-width: 0; }
.evidence h4 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
.evidence h4 .mono { font-weight: 400; color: var(--quiet); font-size: 14px; display: block; }

.scale { position: relative; height: 132px; margin: 0 14px; }
.scale .track { position: absolute; left: 0; right: 0; top: 52px; height: 2px; background: var(--ink); }
.scale .band { position: absolute; top: 40px; height: 26px; background: repeating-linear-gradient(135deg, var(--tint) 0 4px, var(--rule) 4px 5px); border: 1px solid var(--rule-strong); }
.scale .gap { position: absolute; top: 50px; height: 6px; background: var(--hold); }
.scale .mark { position: absolute; width: 2px; transform: translateX(-1px); }
.scale .mark span { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 15px; font-weight: 600; }
.scale .claim { top: 22px; height: 44px; background: var(--hold); }
.scale .claim span { top: -24px; color: var(--hold); }
.scale .video { top: 40px; height: 40px; background: var(--ink); }
.scale .video span { top: 42px; }
.scale .tick { position: absolute; top: 110px; transform: translateX(-50%); font-size: 13px; color: var(--quiet); }
.ev-note { margin-top: 6px; font-size: 16px; }
.frames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.frames div { aspect-ratio: 16 / 10; background: var(--tint); border: 1px solid var(--rule); display: grid; place-items: center; font-size: 13px; color: var(--quiet); }
.frames + p { margin-top: 8px; font-size: 14px; color: var(--quiet); }

.doc { border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--sheet); font-size: 15px; }
.doc .doc-name { padding: 8px 12px; border-bottom: 1px solid var(--rule-strong); background: var(--tint); font-family: var(--mono); font-size: 13px; color: var(--quiet); overflow-wrap: anywhere; }
.g703 { width: 100%; border-collapse: collapse; }
.g703 td { padding: 6px 10px; border-top: 1px solid var(--rule); vertical-align: top; }
.g703 tr:first-child td { border-top: 0; }
.g703 .col { width: 2.6em; font-family: var(--mono); color: var(--quiet); font-size: 13px; border-right: 1px solid var(--rule); text-align: center; padding-top: 8px; }
.g703 .flag td { background: var(--hold-soft); }
.g703 .flag .num { color: var(--hold); font-weight: 600; }
.email dl { margin: 0; padding: 10px 12px; display: grid; grid-template-columns: 1fr; border-bottom: 1px solid var(--rule); }
.email dt { color: var(--quiet); font-size: 13px; }
.email dd + dt { margin-top: 6px; }
.email dd { margin: 0; overflow-wrap: anywhere; }
.email .body { padding: 12px; line-height: 1.55; }
.bad { color: var(--fail); background: var(--fail-soft); outline: 2px solid var(--fail); border-radius: 2px; padding: 0 1px; }
.rush { text-decoration: underline wavy var(--hold); text-underline-offset: 4px; }
.notice dl { margin: 0; padding: 4px 12px 10px; display: grid; grid-template-columns: auto 1fr; gap: 0 16px; }
.notice dt, .notice dd { margin: 0; padding: 6px 0; border-top: 1px solid var(--rule); }
.notice dt { color: var(--quiet); }
.notice dt:first-of-type, .notice dd:first-of-type { border-top: 0; }
.notice h5 { margin: 0; padding: 12px 12px 4px; font-size: 17px; font-weight: 600; }

.domain { font-family: var(--mono); font-size: clamp(14px, 5.4cqw, 26px); line-height: 1; }
.domain .lbl { font-family: var(--sans); font-size: 15px; color: var(--quiet); margin: 0 0 6px; }
.domain .letters { display: flex; }
.domain .letters span { width: 1.2ch; text-align: center; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.domain .letters + .lbl { margin-top: 14px; }
.domain .letters span.bad { outline-offset: -2px; }
.acct { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); }
.acct .mono { font-size: 19px; }

/* Checklist with margin ticks: one tick, cross or ring per check, in a ruled margin */
.checks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.checks li { display: grid; grid-template-columns: 44px 1fr; border-bottom: 1px solid var(--rule); }
.checks .m { border-right: 1px solid var(--rule-strong); display: flex; justify-content: center; padding-top: 12px; }
.checks .m svg { width: 24px; height: 24px; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.checks .pass svg { stroke: var(--pass); }
.checks .fail svg { stroke: var(--fail); }
.checks .ok svg { stroke: var(--hold); }
.checks .t { padding: 11px 0 11px 14px; font-size: 17px; }
.checks .t b { font-weight: 600; }
.checks-group { font-size: 16px; color: var(--quiet); margin: 18px 0 6px; }
.checks-group:first-child { margin-top: 0; }

.lines { width: 100%; border-collapse: collapse; font-size: 16px; }
.lines th { text-align: left; font-weight: 500; color: var(--quiet); font-size: 14px; padding: 6px 8px; border-bottom: 1px solid var(--ink); }
.lines th.num { text-align: right; }
.lines td { padding: 9px 8px; border-bottom: 1px solid var(--rule); }
.lines tr.flag td { background: var(--hold-soft); }
.lines tr.flag .claimed { color: var(--hold); font-weight: 600; }
.scroll-x { overflow-x: auto; }

details > summary { cursor: pointer; color: var(--accent); min-height: 48px; display: flex; align-items: center; list-style: none; text-decoration: underline; text-underline-offset: 3px; }
details > summary::-webkit-details-marker { display: none; }
pre.trace { margin: 8px 0 0; padding: 16px; background: var(--tint); border-radius: 4px; font: 13px/1.5 var(--mono); overflow-x: auto; white-space: pre; }

/* Approve */
.approve > * { max-width: 960px; }
.sec > * { max-width: 1100px; }
.approve h1, .sec h1 { font-size: 34px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }
.approve > p { margin-top: 12px; max-width: 60ch; color: var(--quiet); }
.ask { margin-top: 32px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 32px; display: grid; gap: 32px; }
@media (min-width: 860px) { .ask.lead { grid-template-columns: minmax(0, 1fr) 320px; } }
@media (max-width: 719px) { .ask { padding: 20px 16px; } .approve h1, .sec h1 { font-size: 27px; } }
.ask .big { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: clamp(40px, 9vw, 64px); font-weight: 500; letter-spacing: -0.03em; line-height: 1.05; }
.ask .payee { margin-top: 12px; font-size: 22px; font-weight: 600; }
.ask .why { margin-top: 16px; font-size: 18px; max-width: 46ch; }
.ask .acts { margin-top: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.ask .status { margin-top: 16px; min-height: 1.5em; font-size: 18px; }
.ask.small { padding: 20px 24px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px 24px; }
.ask.small .big { font-size: 30px; }
.ask.small .payee { margin-top: 4px; font-size: 18px; }
@media (max-width: 719px) { .ask.small { grid-template-columns: 1fr; } }
.key { border: 2px solid var(--ink); border-radius: 14px; padding: 18px; background: var(--ground); align-self: start; }
.key .cap { font-size: 14px; color: var(--quiet); margin-bottom: 12px; }
.key .screen { background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 16px; font-family: var(--mono); }
.key .screen .k-amt { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.key .screen p { font-size: 15px; margin-top: 4px; }
.key .pads { display: flex; justify-content: space-around; margin-top: 16px; }
.key .pad { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
.key .pad i { width: 48px; height: 48px; border-radius: 50%; border: 3px solid currentColor; display: block; }
.key .pad.g { color: var(--pass); } .key .pad.g i { background: var(--pass-soft); }
.key .pad.r { color: var(--fail); } .key .pad.r i { background: var(--fail-soft); }
.key.live .pad i { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--tint); } }
.payload { margin-top: 24px; }
.payload dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-family: var(--mono); font-size: 14px; margin: 8px 0 0; }
.payload dt { color: var(--quiet); }
.payload dd { margin: 0; overflow-wrap: anywhere; }

/* Security */
.sec .head-say { margin-top: 16px; font-size: 21px; line-height: 1.55; max-width: 62ch; }
.sec .head-say b { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; }
.sec .head-say + p { margin-top: 12px; color: var(--quiet); }
.sec section { margin-top: 56px; }
.sec section > h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.sec section > h2 + p { margin-top: 8px; color: var(--quiet); max-width: 64ch; }
.sec section > h2 ~ .body { margin-top: 20px; }
.ledger { width: 100%; border-collapse: collapse; font-size: 17px; }
.ledger th { text-align: left; font-weight: 500; color: var(--quiet); font-size: 15px; padding: 8px 12px; border-bottom: 2px solid var(--ink); }
.ledger th.num, .lines th.num { text-align: right; font-family: var(--sans); }
.ledger td { padding: 11px 12px; border-bottom: 1px solid var(--rule); }
.ledger td.m { width: 44px; padding: 8px 0; text-align: center; border-right: 1px solid var(--rule-strong); }
.ledger td.m svg { width: 22px; height: 22px; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke: var(--pass); vertical-align: middle; }
.ledger tfoot td { border-bottom: 3px double var(--ink); font-weight: 600; }
.ledger tr.cur td { background: var(--accent-soft); }
@media (max-width: 719px) { .ledger { font-size: 15px; } .ledger td, .ledger th { padding-inline: 8px; } }

.dial { display: grid; gap: 24px; }
@media (min-width: 860px) { .dial { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; } }
.dial label { display: block; font-weight: 600; }
.dial .val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 44px; font-weight: 500; letter-spacing: -0.02em; margin-top: 4px; }
.dial input[type=range] { width: 100%; height: 48px; accent-color: var(--accent); margin: 8px 0 0; }
.dial .stops { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 13px; color: var(--quiet); }
.dial .say { margin-top: 16px; font-size: 18px; max-width: 48ch; }
.dial .say + p { margin-top: 8px; font-size: 15px; color: var(--quiet); }

.calib { border: 1px dashed var(--rule-strong); border-radius: var(--r); padding: 20px; max-width: 640px; }
.calib svg { display: block; width: 100%; height: auto; }
.calib svg text { fill: var(--quiet); font: 12px var(--sans); }
.calib p { margin-top: 12px; }

.console { display: grid; gap: 20px; }
@media (min-width: 860px) { .console { grid-template-columns: 1fr 1fr; } }
.console form { border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); padding: 20px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.console label { display: block; width: 100%; }
.console label span { display: block; font-size: 15px; color: var(--quiet); margin-bottom: 6px; }
.console select, .console textarea { width: 100%; min-height: 48px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--ground); padding: 10px 12px; font-size: 17px; }
.console textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.outcome { margin-top: 20px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); padding: 20px; }
.outcome .verdict { font-size: 21px; font-weight: 600; }
.outcome .verdict.pass { color: var(--pass); }
.outcome ul { list-style: none; margin: 12px 0 0; padding: 0; }
.outcome li { display: grid; grid-template-columns: 5.5em 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--rule); }
.outcome li .mono { color: var(--quiet); font-size: 15px; padding-top: 2px; }
.outcome .from { margin-top: 12px; font-size: 15px; color: var(--quiet); }
.foot { margin-top: 56px; font-size: 14px; color: var(--quiet); font-family: var(--mono); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

        const open = D.details[r.id];
        const inner = `<span class="who">${esc(r.sub)}</span><span class="num">${money(r.amount)}</span><span class="why">${chip(r.status)}<span>${esc(why(r))}</span></span>`;
        return `<li>${open ? `<button class="row" data-open="${r.id}" ${S.sel === r.id ? 'aria-current="true"' : ""}>${inner}</button>` : `<div class="row">${inner}</div>`}</li>`;
      }).join("")}</ul>
      <div class="job-total"><span>Total this period</span><span class="num">${money(sum(rs))}</span></div>
    </section>`;
  }).join("");

  return `<main class="wrap">
    <h1 class="lede">${ready.length} of ${rows.length} pay requests are ready to pay. ${ok.length} need your OK and ${hold.length} are on hold.</h1>
    <p class="lede-sub">Ready <span class="mono">${money(sum(ready))}</span>, waiting for your OK <span class="mono">${money(sum(ok))}</span>, on hold <span class="mono">${money(sum(hold))}</span>. Every request was checked against the same ${Object.keys(RULE_NAMES).length} rules.</p>
    <div class="pr"><div>${list}</div>${detail(D.details[S.sel])}</div>
  </main>`;
}

function detail(d) {
  const r = D.requests.find(x => x.id === d.id);
  const name = short(d.sub);
  const overLimit = failed(d, "14");
  let say, next, nextNote = "", evidence = "";

  if (d.status === "on_hold" && failed(d, "13")) {
    const o = ev(d, "13").evidence.overstatements[0], l = d.lines.find(x => x.item_no === o.item_no);
    const claimed = Number(o.claimed_pct), video = Number(o.video_estimate_pct), tol = Number(o.tolerance);
    say = `On hold: ${name} billed ${l.description.toLowerCase()} at ${claimed}%, but the site video from ${dayShort(d.site_evidence.date)} shows ${video}%.`;
    next = "Ask the super to re-verify progress";
    evidence = `<div class="evidence">
      <div><h4>Line ${esc(l.item_no)}, ${esc(l.description.toLowerCase())}, against the site video</h4>
        <div class="scale" role="img" aria-label="Billed ${claimed} percent. Site video ${video} percent. Allowed within ${tol} points of the video.">
          <div class="band" style="left:${video - tol}%;width:${2 * tol}%"></div>
          <div class="track"></div>
          <div class="gap" style="left:${video}%;width:${claimed - video}%"></div>
          <div class="mark video" style="left:${video}%"><span>Video ${video}%</span></div>
          <div class="mark claim" style="left:${claimed}%"><span>Billed ${claimed}%</span></div>
          ${[0, 25, 50, 75, 100].map(t => `<span class="tick mono" style="left:${t}%">${t}</span>`).join("")}
        </div>
        <p class="ev-note">${Number(o.gap)} points apart. Up to ${tol} is allowed (the shaded band).</p>
        <div class="frames" aria-hidden="true">${d.site_evidence.frames.map((_, i) => `<div>Frame ${i + 1}</div>`).join("")}</div>
        <p>Site video, ${day(d.site_evidence.date)}, ${d.site_evidence.frames.length} frames. The images aren't in the mockup data.</p>
      </div>
      <div><h4>Their G703, line ${esc(l.item_no)}</h4>
        <div class="doc"><div class="doc-name">${esc(d.source_doc)}</div>
          <table class="g703"><tbody>
            <tr><td class="col">A</td><td>Item</td><td class="num">${esc(l.item_no)}</td></tr>
            <tr><td class="col">B</td><td>Description</td><td class="num" style="font-family:var(--sans)">${esc(l.description)}</td></tr>
            <tr><td class="col">C</td><td>Scheduled value</td><td class="num">${cents(l.scheduled_value)}</td></tr>
            <tr><td class="col">D</td><td>From previous applications</td><td class="num">${cents(l.previous_applications)}</td></tr>
            <tr><td class="col">E</td><td>This period</td><td class="num">${cents(l.this_period)}</td></tr>
            <tr><td class="col">F</td><td>Materials stored</td><td class="num">${cents(l.stored_materials)}</td></tr>
            <tr><td class="col">G</td><td>Completed and stored to date</td><td class="num">${cents(l.total_to_date)}</td></tr>
            <tr class="flag"><td class="col">G÷C</td><td>Percent complete <span class="sr">(this is the claim the video disputes)</span></td><td class="num">${esc(o.printed_pct)}%</td></tr>
            <tr><td class="col">H</td><td>Balance to finish</td><td class="num">${cents(l.balance_to_finish)}</td></tr>
            <tr><td class="col">I</td><td>Retainage</td><td class="num">${cents(l.retainage)}</td></tr>
          </tbody></table></div>
      </div></div>`;
  } else if (d.status === "on_hold" && failed(d, "10")) {
    const b = ev(d, "10").evidence, m = failed(d, "11") ? ev(d, "11").evidence.mismatches[0] : null;
    const email = D.facts.find(f => f.table === "emails" && f.data.id === (m && m.email_id))?.data;
    const pos = m ? m.differences[0].position : -1, diff = m && m.differences[0];
    const letters = (s, bad) => `<div class="letters">${[...s].map((c, i) => `<span${bad && i === pos ? ' class="bad"' : ""}>${esc(c)}</span>`).join("")}</div>`;
    const glyph = c => `<span class="mono" style="font-size:1.15em">${esc(c)}</span>`; // in sans, I and l look the same
    const saidAs = c => /[A-Z]/.test(c) ? `a capital ${glyph(c)}` : /[a-z]/.test(c) ? `a lowercase ${glyph(c)}` : glyph(c);
    say = `On hold: an email that looks like it's from ${name} asks us to pay a new bank account. It came from a lookalike domain.`;
    next = "Call to verify the new bank details";
    nextNote = `Use the number on file for ${name}, not one from the email.`;
    const body = email ? esc(email.body).replace(esc(email.claims.new_account), `<span class="mono">${ending(email.claims.new_account)}</span>`)
      .replace(esc("before Friday's payment run"), m => `<span class="rush">${m}</span>`) : "";
    const from = email ? esc(email.from_addr).replace(esc(m.claimed_domain), [...m.claimed_domain].map((c, i) => i === pos ? `<span class="bad">${esc(c)}</span>` : esc(c)).join("")) : "";
    evidence = `<div class="evidence">
      <div><h4>Where the email came from</h4>
        ${m ? `<div class="domain"><p class="lbl">The email</p>${letters(m.claimed_domain, true)}<p class="lbl">${esc(name)}'s real domain</p>${letters(m.vendor_domain, false)}</div>
        <p class="ev-note">Letter ${pos + 1} is ${saidAs(diff.claimed)}, not ${saidAs(diff.vendor)}. On most screens they look the same.</p>` : ""}
        <div class="acct"><p class="quiet" style="font-size:15px">Bank account</p>
          <p class="mono">${ending(b.on_file)} → ${ending(b.requested)}</p>
          <p class="ev-note">The new account hasn't been verified.</p></div>
      </div>
      ${email ? `<div><h4>The email</h4>
        <div class="doc email"><dl>
          <dt>From</dt><dd class="mono" style="font-size:14px">${from}</dd>
          <dt>Subject</dt><dd>${esc(email.subject)}</dd>
          <dt>Sent</dt><dd>${day(email.sent_at)}, ${new Date(email.sent_at).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}</dd>
        </dl><div class="body">${body}</div></div>
        <p class="ev-note quiet" style="font-size:15px">Underlined: a rush, which is how these usually read.</p>
      </div>` : ""}</div>`;
  } else if (d.status === "on_hold" && failed(d, "07")) {
    const u = ev(d, "07").evidence.unresolved[0];
    const fact = D.facts.find(f => f.table === "lower_tier_notices" && f.data.supplier === u.supplier && f.data.notice_date === u.notice_date)?.data;
    say = `On hold: ${name}'s supplier, ${u.supplier}, filed a notice to owner and hasn't released.`;
    next = "Ask for the supplier's release";
    evidence = `<div class="evidence">
      <div><h4>What's missing</h4>
        <ul class="checks"><li><span class="m pass">${MARK.pass}<span class="sr">Done:</span></span><span class="t">Notice to owner filed ${day(u.notice_date)}</span></li>
        <li><span class="m fail">${MARK.fail}<span class="sr">Missing:</span></span><span class="t">${esc(u.supplier)}'s release: not received</span></li></ul>
        <p class="ev-note">Until it comes in, ${esc(u.supplier)} can claim against the property for what ${name} owes them.</p></div>
      <div><h4>Notice to owner</h4>
        <div class="doc notice"><h5>${esc(u.supplier)}</h5><dl>
          <dt>Supplying</dt><dd>${esc(d.sub)}</dd>
          <dt>Job</dt><dd>${esc(d.job)}</dd>
          <dt>Filed</dt><dd>${day(u.notice_date)}</dd>
          <dt>Released</dt><dd>No</dd>
        </dl>${fact ? `<div class="doc-name" style="border-top:1px solid var(--rule-strong);border-bottom:0">${esc(fact.id)}</div>` : ""}</div></div></div>`;
  } else {
    say = `Needs your OK: every check passed, but ${money(d.amount)} is over the ${money(LIMIT).replace(".00", "")} auto-release limit.`;
    next = "Send to the approval key";
  }
  if (d.status === "on_hold" && overLimit) nextNote = (nextNote ? nextNote + " " : "") + `Once that's settled, this still needs the owner's OK: it's over the ${money(LIMIT).replace(".00", "")} limit.`;

  const results = d.trace.results;
  const kind = x => x.passed ? "pass" : ESCALATE.has(x.rule.slice(0, 2)) ? "ok" : "fail";
  const word = { pass: "Passed", fail: "Didn't pass", ok: "Needs the owner" };
  const item = x => { const k = kind(x); return `<li><span class="m ${k}">${MARK[k]}<span class="sr">${word[k]}:</span></span><span class="t"><b>${RULE_NAMES[x.rule.slice(0, 2)]}.</b> ${esc(humanize(x.message))}</span></li>`; };
  const attention = results.filter(x => !x.passed), passed = results.filter(x => x.passed);
  const flagged = new Set((ev(d, "13").evidence.overstatements || []).map(o => o.item_no));

  return `<article class="detail ${S.sheet ? "open" : ""}" aria-labelledby="d-title">
    <button class="link back" data-close>Back to pay requests</button>
    <div class="d-head"><div><h2 id="d-title" tabindex="-1">${esc(d.sub)}</h2><p class="quiet">${esc(d.job)}, period ending ${day(d.period_end)}</p></div>
      <p class="d-amt mono">${money(d.amount)} <span class="quiet" style="font: 15px var(--sans)">this period</span></p></div>
    <p class="d-say">${esc(say)}</p>
    <div class="d-next"><button class="btn" ${d.status === "needs_ok" ? 'data-tab="approve"' : ""}>${next}</button>${nextNote ? `<p>${esc(nextNote)}</p>` : ""}</div>
    ${evidence ? `<div class="section">${evidence}</div>` : ""}
    <div class="section"><h3>${results.length} checks, ${passed.length} passed</h3>
      ${attention.length ? `<p class="checks-group">Needs attention</p><ul class="checks">${attention.map(item).join("")}</ul>` : ""}
      <p class="checks-group">Passed</p><ul class="checks">${passed.map(item).join("")}</ul></div>
    <div class="section"><h3>Lines on this request</h3><div class="scroll-x"><table class="lines">
      <thead><tr><th>Item</th><th>Description</th><th class="num">Billed</th><th class="num">Video</th><th class="num">To date</th></tr></thead>
      <tbody>${d.lines.map(l => `<tr class="${flagged.has(l.item_no) ? "flag" : ""}"><td class="mono">${esc(l.item_no)}</td><td>${esc(l.description)}</td><td class="num claimed">${esc(l.pct_complete)}%</td><td class="num">${l.video_pct == null ? "none" : esc(l.video_pct) + "%"}</td><td class="num">${cents(l.total_to_date)}</td></tr>`).join("")}</tbody>
    </table></div></div>
    <div class="section"><details><summary>Show details</summary><pre class="trace">${esc(JSON.stringify(d.trace, null, 2))}</pre></details></div>
  </article>`;
}

function approveScreen() {
  const asks = D.requests.filter(r => r.status === "needs_ok").sort((a, b) => b.amount - a.amount);
  const [lead, ...rest] = asks;
  const d = D.details[lead.id];
  const others = d.trace.results.filter(x => x.passed).length;
  const w = S.waiting;
  const status = w == null ? "" : w > 0
    ? `Press green on the key to pay, red to refuse. It waits <span class="mono">${w}</span> more seconds.`
    : "The key wasn't pressed in time, so nothing was paid. Send it again when you're at your desk.";
  return `<main class="wrap approve">
    <h1>Payments waiting for your OK</h1>
    <p>Every check passed on these. They need you because of their size, a new sub, or new bank details. Nothing goes out until you press green on the approval key on your desk.</p>
    <article class="ask lead" aria-labelledby="a-${lead.id}">
      <div>
        <p class="big">${money(lead.amount)}</p>
        <p class="payee" id="a-${lead.id}">${esc(lead.sub)}</p>
        <p class="quiet">${esc(lead.job)}, period ending ${day(lead.period_end)}</p>
        <p class="why">You're asked because it's over the ${money(LIMIT).replace(".00", "")} auto-release limit. The other ${others} checks passed.</p>
        <div class="acts">
          <button class="btn" data-send ${w > 0 ? "disabled" : ""}>${w > 0 ? "Waiting for the key" : "Send to the approval key"}</button>
          <button class="link" data-open-tab="${lead.id}">See every check</button>
        </div>
        <p class="status" aria-live="polite">${status}</p>
        <details class="payload"><summary>What your tap signs</summary>
          <dl><dt>request_id</dt><dd>${esc(lead.id)}</dd><dt>payee</dt><dd>${esc(lead.sub)}</dd><dt>amount</dt><dd>${esc(lead.amount)}</dd><dt>job</dt><dd>${esc(lead.job)}</dd>
          <dt>nonce</dt><dd class="quiet">made when you press Send</dd><dt>expires_at</dt><dd class="quiet">90 seconds after sending</dd></dl>
          <p class="quiet" style="font-size:15px;margin-top:8px">The signature covers this exact payee and amount and pays once.</p></details>
      </div>
      <figure class="key ${w > 0 ? "live" : ""}" style="margin:0" aria-label="What the approval key on your desk shows">
        <figcaption class="cap">What the key on your desk shows</figcaption>
        <div class="screen"><p class="k-amt">${money(lead.amount)}</p><p>${esc(lead.sub)}</p><p class="quiet">${esc(lead.job)}</p></div>
        <div class="pads" aria-hidden="true"><span class="pad g"><i></i>Pay</span><span class="pad r"><i></i>Refuse</span></div>
      </figure>
    </article>
    ${rest.map(r => `<article class="ask small"><div><p class="big">${money(r.amount)}</p><p class="payee">${esc(r.sub)}</p><p class="quiet">${esc(r.job)}</p></div>
      <button class="btn plain" disabled title="One at a time: the key shows one payment">Send after the one above</button></article>`).join("")}
  </main>`;
}

function securityScreen() {
  const c = D.scorecard;
  const singles = Object.entries(c.by_anomaly).filter(([k]) => !k.includes("+"));
  const combos = Object.entries(c.by_anomaly).filter(([k]) => k.includes("+"));
  const add = (list, key) => list.reduce((a, [, v]) => a + v[key], 0);
  const stopped = c.mutated - c.wrongful_if_every_button_approved;
  const L = c.limit_sweep, cur = L[S.limitIdx];
  const contractIdx = L.findIndex(x => x.limit === LIMIT);

  const ledgerRow = (label, v) => `<tr><td class="m">${v.wrongful === 0 && v.right_rule === v.n ? MARK.pass : ""}<span class="sr">${v.wrongful === 0 ? "Caught" : "Got through"}</span></td><td>${esc(label)}</td><td class="num">${whole(v.n)}</td><td class="num">${whole(v.right_rule)}</td><td class="num">${whole(v.wrongful)}</td></tr>`;

  const a = S.attack, stat = c.by_anomaly[a], ex = EXAMPLE[a] && D.details[EXAMPLE[a]];
  const targetSub = D.requests.find(r => r.sub_id === S.target);
  let out = "";
  if (S.ran === "pick") {
    const fired = ex ? ex.trace.results.filter(x => !x.passed) : [];
    out = `<div class="outcome" aria-live="polite">
      ${ex ? `<p class="verdict pass">Stopped by the rules.</p>
        <ul>${fired.map(x => `<li><span class="mono">rule ${x.rule.slice(0, 2)}</span><span><b>${RULE_NAMES[x.rule.slice(0, 2)]}.</b> ${esc(humanize(x.message))}${ESCALATE.has(x.rule.slice(0, 2)) ? " This one alone would only ask the owner." : ""}</span></li>`).join("")}</ul>
        <p class="from">Mockup: this is the real trace of the same attack on ${esc(ex.sub)}'s request this month${targetSub && targetSub.sub_id !== ex.sub_id ? `, not a run against ${esc(targetSub.sub)}` : ""}.</p>`
      : `<p class="verdict">This mockup has rule-level results for three attacks only.</p>`}
      <p class="from">In the fuzz run this attack was tried ${whole(stat.n)} times. The right rule caught it ${whole(stat.right_rule)} times; it was paid ${whole(stat.wrongful)} times.</p>
    </div>`;
  } else if (S.ran === "text") {
    out = `<div class="outcome" aria-live="polite"><p class="verdict">Not available in the mockup.</p><p class="from">In Draw, Claude maps what you wrote to one of the attacks on the list, then runs it through the same pipeline.</p></div>`;
  }

  return `<main class="wrap sec">
    <h1>How often can Draw be robbed?</h1>
    <p class="head-say">We sent <b>${whole(c.mutated)}</b> forged or broken pay requests through the real pipeline. The rules stopped <b>${pct(c.rule_catch_rate)}</b> of them on their own (${whole(stopped)}). <b>${whole(c.wrongful_if_every_button_approved)}</b> would have been paid even if the owner tapped approve without reading, and <b>${whole(c.wrongful_releases)}</b> went out with no tap at all. Of ${whole(c.clean)} honest requests, <b>${pct(c.false_hold_rate)}</b> were held by mistake.</p>
    <p>That stopped <span class="mono">${money(c.dollars_protected)}</span> in bad payments and held up <span class="mono">${money(c.dollars_delayed)}</span> of good ones. ${c.misses.length ? "" : "No attack got through in this run."}</p>

    <section aria-labelledby="s-ledger"><h2 id="s-ledger">Every kind of attack we tried</h2>
      <div class="body scroll-x"><table class="ledger">
        <thead><tr><th><span class="sr">Caught</span></th><th>Attack</th><th class="num">Tried</th><th class="num">Caught by the right rule</th><th class="num">Paid with no tap</th></tr></thead>
        <tbody>${singles.sort((x, y) => ATTACKS[x[0]].localeCompare(ATTACKS[y[0]])).map(([k, v]) => ledgerRow(ATTACKS[k] || k, v)).join("")}
          ${ledgerRow("Two of these at once", { n: add(combos, "n"), right_rule: add(combos, "right_rule"), wrongful: add(combos, "wrongful") })}</tbody>
        <tfoot><tr><td></td><td>All attacks</td><td class="num">${whole(c.mutated)}</td><td class="num">${whole(add(Object.entries(c.by_anomaly), "right_rule"))}</td><td class="num">${whole(c.wrongful_releases)}</td></tr></tfoot>
      </table></div></section>

    <section aria-labelledby="s-dial"><h2 id="s-dial">The auto-release limit is a dial</h2>
      <p>Lower, and the owner taps the key more often. Higher, and more honest requests go out on the rules alone.</p>
      <div class="body dial">
        <div>
          <label for="limit">Auto-release limit</label>
          <p class="val" id="limit-val">${money(cur.limit).replace(".00", "")}</p>
          <input id="limit" type="range" min="0" max="${L.length - 1}" step="1" value="${S.limitIdx}" aria-valuetext="${money(cur.limit).replace(".00", "")}">
          <div class="stops" aria-hidden="true">${L.map(x => `<span>${x.limit / 1000}k</span>`).join("")}</div>
          <p class="say">At ${money(cur.limit).replace(".00", "")}, the owner taps the key about <span class="mono">${cur.button_presses_per_job_month}</span> times per job each month, <span class="mono">${pct(cur.auto_released_share)}</span> of honest requests pay on the rules alone, and ${cur.attacks_auto_paid === 0 ? "no attack gets paid without a tap" : `${cur.attacks_auto_paid} attacks get paid without a tap`}.</p>
          <p>${S.limitIdx === contractIdx ? "This is your contract's limit today." : `Your contract says ${money(LIMIT).replace(".00", "")}. Moving the dial here only previews it.`}</p>
        </div>
        <div class="scroll-x"><table class="ledger">
          <thead><tr><th>Limit</th><th class="num">Taps per job a month</th><th class="num">Paid on rules alone</th><th class="num">Attacks paid</th></tr></thead>
          <tbody>${L.map((x, i) => `<tr class="${i === S.limitIdx ? "cur" : ""}"><td class="mono">${money(x.limit).replace(".00", "")}${i === contractIdx ? ' <span class="quiet" style="font-family:var(--sans);font-size:14px">contract</span>' : ""}</td><td class="num">${x.button_presses_per_job_month}</td><td class="num">${pct(x.auto_released_share)}</td><td class="num">${x.attacks_auto_paid}</td></tr>`).join("")}</tbody>
        </table></div>
      </div></section>

    <section aria-labelledby="s-calib"><h2 id="s-calib">Is Jev's confidence honest?</h2>
      <p>When Jev says it's 80% sure, it should be right about 80% of the time. That's what makes the escalation threshold mean something.</p>
      <div class="body calib">
        <svg viewBox="0 0 600 300" role="img" aria-label="Empty chart: no calibration run yet">
          <line x1="50" y1="260" x2="580" y2="260" stroke="var(--rule-strong)"/><line x1="50" y1="20" x2="50" y2="260" stroke="var(--rule-strong)"/>
          <line x1="50" y1="260" x2="580" y2="20" stroke="var(--rule-strong)" stroke-dasharray="6 6"/>
          ${[0, 50, 100].map(t => `<text x="${50 + t * 5.3}" y="280" text-anchor="middle">${t}%</text><text x="40" y="${264 - t * 2.4}" text-anchor="end">${t}%</text>`).join("")}
          <text x="315" y="298" text-anchor="middle">How sure Jev said it was</text>
          <text x="440" y="70" text-anchor="middle">Honest confidence</text>
        </svg>
        <p>No calibration run yet. It shows up here after <span class="mono">python -m fuzzer.calibration</span> runs on the server.</p>
      </div></section>

    <section aria-labelledby="s-console"><h2 id="s-console">Your turn: try to get paid</h2>
      <p>Pick an attack and a sub, or describe one in your own words. It runs through the same pipeline.</p>
      <div class="body">
        <div class="console">
          <form data-run="pick">
            <label><span>Attack</span><select id="attack">${Object.entries(ATTACKS).map(([k, w]) => `<option value="${k}" ${k === a ? "selected" : ""}>${esc(w)}</option>`).join("")}</select></label>
            <label><span>Against</span><select id="target">${D.requests.map(r => `<option value="${r.sub_id}" ${r.sub_id === S.target ? "selected" : ""}>${esc(r.sub)}</option>`).join("")}</select></label>
            <button class="btn" type="submit">Run this attack</button>
          </form>
          <form data-run="text">
            <label><span>Or describe it</span><textarea id="describe">The electrician says the owner told them retainage is waived this month.</textarea></label>
            <button class="btn" type="submit">Run what I described</button>
          </form>
        </div>
        ${out}
      </div></section>

    <p class="foot">${esc(c.kernel)}, ${whole(c.cases)} cases from make fuzz. Sample company, synthetic data.</p>
  </main>`;
}

/* ---------- render and events ---------- */
let timer = null;
function render() {
  const screen = S.tab === "approve" ? approveScreen() : S.tab === "security" ? securityScreen() : requestsScreen();
  document.getElementById("app").innerHTML = topbar() + screen;
  const small = matchMedia("(max-width: 1099px)").matches;
  document.body.style.overflow = S.tab === "requests" && S.sheet && small ? "hidden" : "";
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-screen],[data-tab],[data-open],[data-close],[data-send],[data-open-tab]");
  if (!t) return;
  if (t.dataset.screen) return go(t.dataset.screen);
  if (t.dataset.tab) { e.preventDefault(); return go(t.dataset.tab === "requests" ? "drywall" : t.dataset.tab); }
  if (t.dataset.open) { S.sel = t.dataset.open; S.sheet = true; history.replaceState(null, "", "#" + (currentScreen() || "drywall")); render(); document.getElementById("d-title").focus(); return; }
  if (t.dataset.openTab) { S.tab = "requests"; S.sel = t.dataset.openTab; S.sheet = true; history.replaceState(null, "", "#drywall"); render(); scrollTo(0, 0); return; }
  if ("close" in t.dataset) { S.sheet = false; render(); document.querySelector(`[data-open="${S.sel}"]`)?.focus(); return; }
  if ("send" in t.dataset) {
    S.waiting = 90; render(); clearInterval(timer);
    timer = setInterval(() => { S.waiting--; if (S.waiting <= 0) clearInterval(timer); if (S.tab === "approve") render(); }, 1000);
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "limit") { S.limitIdx = Number(e.target.value); render(); document.getElementById("limit").focus(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "attack") { S.attack = e.target.value; const ex = EXAMPLE[S.attack]; if (ex) S.target = D.details[ex].sub_id; S.ran = null; render(); document.getElementById("attack").focus(); }
  if (e.target.id === "target") { S.target = e.target.value; S.ran = null; render(); document.getElementById("target").focus(); }
});
document.addEventListener("submit", e => { e.preventDefault(); S.ran = e.target.dataset.run; render(); });

go(location.hash.slice(1) || "drywall");
</script>
</body>
</html>
